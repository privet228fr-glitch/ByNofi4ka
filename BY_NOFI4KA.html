<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>BY NOFI4KA</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #000;
      --surface: #0b0b0d;
      --surface-2: #131316;
      --line: rgba(255,255,255,.09);
      --text: #f7f7f8;
      --muted: #94949d;
      --accent: #9272ff;
      --accent-rgb: 146, 114, 255;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
    body { min-height: 100dvh; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
    button, input { font: inherit; }
    button { color: inherit; }
    [hidden] { display: none !important; }

    .app {
      min-height: 100dvh;
      background:
        radial-gradient(circle at 50% -15%, rgba(var(--accent-rgb), .12), transparent 34rem),
        #000;
      transition: background .6s ease;
    }

    .shell {
      width: min(100%, 760px);
      min-height: 100dvh;
      margin: 0 auto;
      padding: 0 18px calc(118px + var(--safe-bottom));
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 78px;
      padding: env(safe-area-inset-top, 0px) 2px 0;
      background: linear-gradient(#000 62%, transparent);
    }

    .brand {
      margin: 0;
      font-size: clamp(17px, 4.8vw, 22px);
      font-weight: 760;
      letter-spacing: .30em;
      white-space: nowrap;
    }

    .round-button, .icon-button, .primary-control {
      border: 0;
      display: inline-grid;
      place-items: center;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform .18s ease, background .18s ease, color .18s ease, opacity .18s ease;
    }
    .file-picker {
      position: relative;
      overflow: hidden;
    }
    .native-file-input {
      position: absolute;
      z-index: 3;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      font-size: 100px;
    }
    .round-button:active, .icon-button:active, .primary-control:active { transform: scale(.92); }
    .round-button {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #fff;
      color: #000;
      box-shadow: 0 8px 26px rgba(255,255,255,.10);
    }
    .round-button svg { width: 21px; height: 21px; }

    .library-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      margin: 24px 2px 18px;
    }
    .library-heading h2 { margin: 0; font-size: 29px; letter-spacing: -.04em; }
    .library-heading span { color: var(--muted); font-size: 13px; }

    .empty {
      min-height: calc(100dvh - 190px);
      display: grid;
      place-content: center;
      justify-items: center;
      text-align: center;
      padding: 30px 18px;
    }
    .empty-art {
      width: min(66vw, 290px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 34px;
      color: var(--accent);
      background:
        radial-gradient(circle at 35% 24%, rgba(var(--accent-rgb), .18), transparent 42%),
        #0d0d0f;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.025), 0 30px 90px rgba(0,0,0,.48);
      animation: breathe 5s ease-in-out infinite;
    }
    .empty-art svg { width: 42%; height: 42%; filter: drop-shadow(0 12px 25px rgba(var(--accent-rgb), .3)); }
    .empty h2 { margin: 28px 0 8px; font-size: 25px; letter-spacing: -.03em; }
    .empty p { margin: 0 0 24px; color: var(--muted); }
    .add-large {
      min-height: 48px;
      padding: 0 22px;
      border: 0;
      border-radius: 999px;
      background: #fff;
      color: #000;
      font-weight: 760;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .track-list { display: grid; gap: 6px; }
    .track-row {
      position: relative;
      display: grid;
      grid-template-columns: 58px minmax(0, 1fr) auto;
      align-items: center;
      gap: 13px;
      width: 100%;
      min-height: 70px;
      padding: 6px 8px 6px 6px;
      border: 0;
      border-radius: 16px;
      background: transparent;
      text-align: left;
      cursor: pointer;
      user-select: none;
      touch-action: pan-y;
      transition: background .2s ease, transform .2s ease;
      animation: rowIn .38s both;
    }
    .track-row:hover { background: rgba(255,255,255,.045); }
    .track-row:active { transform: scale(.985); }
    .track-row.active { background: rgba(var(--accent-rgb), .10); }
    .track-row.active .track-title { color: var(--accent); }
    .track-cover, .mini-cover, .sheet-cover {
      position: relative;
      overflow: hidden;
      flex: 0 0 auto;
      background: #151518;
    }
    .track-cover { width: 58px; height: 58px; border-radius: 12px; }
    .track-cover img, .mini-cover img, .sheet-cover img, .cover-image {
      width: 100%; height: 100%; display: block; object-fit: cover;
    }
    .cover-fallback {
      width: 100%; height: 100%; display: grid; place-items: center;
      color: rgba(255,255,255,.74);
      background:
        radial-gradient(circle at 24% 16%, rgba(var(--row-rgb, var(--accent-rgb)), .62), transparent 46%),
        linear-gradient(145deg, #25252b, #0b0b0d 72%);
    }
    .cover-fallback svg { width: 42%; height: 42%; }
    .track-text { min-width: 0; }
    .track-title, .track-artist { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .track-title { font-size: 15px; font-weight: 690; letter-spacing: -.01em; }
    .track-artist { margin-top: 5px; color: var(--muted); font-size: 13px; }
    .track-duration { color: #6f6f77; font-size: 12px; font-variant-numeric: tabular-nums; }

    .equalizer {
      position: absolute;
      right: 5px;
      bottom: 5px;
      width: 22px;
      height: 18px;
      display: flex;
      align-items: end;
      justify-content: center;
      gap: 2px;
      padding: 3px;
      border-radius: 7px;
      background: rgba(0,0,0,.74);
      opacity: 0;
      transition: opacity .2s ease;
    }
    .track-row.active.playing .equalizer { opacity: 1; }
    .equalizer i { width: 2px; height: 5px; border-radius: 3px; background: #fff; animation: eq .72s ease-in-out infinite alternate; }
    .equalizer i:nth-child(2) { animation-delay: -.38s; }
    .equalizer i:nth-child(3) { animation-delay: -.16s; }

    .mini-player {
      position: fixed;
      z-index: 50;
      left: 50%;
      bottom: calc(12px + var(--safe-bottom));
      transform: translateX(-50%);
      width: min(calc(100% - 24px), 724px);
      min-height: 74px;
      display: grid;
      grid-template-columns: 52px minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 22px;
      background:
        linear-gradient(110deg, rgba(var(--accent-rgb), .28), rgba(15,15,18,.92) 42%),
        rgba(12,12,14,.88);
      backdrop-filter: blur(24px) saturate(1.35);
      -webkit-backdrop-filter: blur(24px) saturate(1.35);
      box-shadow: 0 18px 60px rgba(0,0,0,.55);
      animation: miniIn .35s cubic-bezier(.2,.8,.2,1) both;
      cursor: pointer;
    }
    .mini-cover { width: 52px; height: 52px; border-radius: 13px; }
    .mini-text { min-width: 0; }
    .mini-title, .mini-artist { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mini-title { font-size: 14px; font-weight: 730; }
    .mini-artist { margin-top: 4px; color: rgba(255,255,255,.62); font-size: 12px; }
    .mini-actions { display: flex; align-items: center; gap: 2px; }
    .mini-actions button { width: 42px; height: 42px; border: 0; border-radius: 50%; background: transparent; display: grid; place-items: center; cursor: pointer; }
    .mini-actions svg { width: 23px; height: 23px; }

    .player-view {
      position: fixed;
      z-index: 100;
      inset: 0;
      display: grid;
      grid-template-rows: auto 1fr;
      background:
        radial-gradient(circle at 50% 22%, rgba(var(--accent-rgb), .30), transparent 34rem),
        linear-gradient(#0a0a0c, #000 72%);
      transform: translateY(102%);
      visibility: hidden;
      transition: transform .52s cubic-bezier(.2,.82,.2,1), visibility .52s;
      overflow: hidden;
    }
    .player-view.open { transform: translateY(0); visibility: visible; }
    .player-top {
      width: min(100%, 760px);
      margin: 0 auto;
      padding: calc(10px + env(safe-area-inset-top, 0px)) 18px 0;
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      gap: 8px;
    }
    .player-top button { width: 44px; height: 44px; border: 0; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.06); cursor: pointer; }
    .player-top svg { width: 22px; height: 22px; }
    .player-top-title { text-align: center; }
    .player-top-title strong { display: block; font-size: 12px; letter-spacing: .17em; text-transform: uppercase; }
    .player-top-title span { display: block; margin-top: 3px; color: rgba(255,255,255,.48); font-size: 11px; }

    .player-content {
      width: min(100%, 620px);
      min-height: 0;
      margin: 0 auto;
      display: grid;
      grid-template-rows: minmax(230px, 1fr) auto auto auto;
      align-items: center;
      padding: clamp(14px, 3.2vh, 28px) 24px calc(22px + var(--safe-bottom));
    }
    .art-stage {
      width: 100%;
      min-height: 0;
      display: grid;
      place-items: center;
      perspective: 1200px;
      touch-action: pan-y;
    }
    .art-card {
      width: min(78vw, 390px, 44vh);
      aspect-ratio: 1;
      position: relative;
      border-radius: clamp(24px, 7vw, 42px);
      overflow: hidden;
      background: #121216;
      box-shadow: 0 38px 90px rgba(0,0,0,.52), 0 0 0 1px rgba(255,255,255,.06);
      transform-origin: 50% 135%;
      will-change: transform, opacity;
      cursor: grab;
    }
    .art-card:active { cursor: grabbing; }
    .art-card .cover-fallback svg { width: 30%; height: 30%; }
    .cover-shine { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(125deg, rgba(255,255,255,.11), transparent 24%, transparent 72%, rgba(255,255,255,.035)); }

    .player-meta { width: 100%; min-width: 0; margin-top: clamp(13px, 2.2vh, 24px); text-align: center; }
    .player-title { margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: clamp(23px, 6.6vw, 32px); letter-spacing: -.045em; }
    .player-artist { margin: 7px 0 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: rgba(255,255,255,.58); font-size: 15px; }

    .timeline { width: 100%; margin-top: clamp(18px, 3vh, 28px); }
    .range-wrap { position: relative; height: 18px; display: flex; align-items: center; }
    .range-track { position: absolute; left: 0; right: 0; height: 4px; border-radius: 999px; background: rgba(255,255,255,.16); overflow: hidden; pointer-events: none; }
    .range-fill { width: 0; height: 100%; border-radius: inherit; background: var(--accent); box-shadow: 0 0 14px rgba(var(--accent-rgb), .42); }
    #seek { position: relative; width: 100%; height: 18px; margin: 0; opacity: 0; cursor: pointer; }
    .time-row { display: flex; justify-content: space-between; margin-top: 3px; color: rgba(255,255,255,.48); font-size: 11px; font-variant-numeric: tabular-nums; }

    .controls {
      width: 100%;
      display: grid;
      grid-template-columns: 48px 1fr 78px 1fr 48px;
      align-items: center;
      gap: 4px;
      margin-top: clamp(12px, 2.6vh, 25px);
    }
    .icon-button { width: 48px; height: 48px; justify-self: center; border-radius: 50%; background: transparent; color: rgba(255,255,255,.72); }
    .icon-button svg { width: 24px; height: 24px; }
    .icon-button.active { color: var(--accent); background: rgba(var(--accent-rgb), .12); }
    .primary-control {
      width: 72px;
      height: 72px;
      justify-self: center;
      border-radius: 50%;
      background: #fff;
      color: #000;
      box-shadow: 0 15px 38px rgba(0,0,0,.35), 0 0 38px rgba(var(--accent-rgb), .13);
    }
    .primary-control svg { width: 31px; height: 31px; }
    .repeat-badge { position: absolute; transform: translate(10px, 10px); font-size: 8px; font-weight: 850; }

    .scrim {
      position: fixed;
      z-index: 190;
      inset: 0;
      background: rgba(0,0,0,.64);
      opacity: 0;
      visibility: hidden;
      transition: opacity .25s ease, visibility .25s;
      backdrop-filter: blur(5px);
    }
    .scrim.show { opacity: 1; visibility: visible; }
    .action-sheet {
      position: fixed;
      z-index: 200;
      left: 50%;
      bottom: 0;
      width: min(100%, 620px);
      padding: 10px 16px calc(16px + var(--safe-bottom));
      border-radius: 28px 28px 0 0;
      background: #151517;
      transform: translate(-50%, 105%);
      transition: transform .36s cubic-bezier(.2,.82,.2,1);
      box-shadow: 0 -20px 70px rgba(0,0,0,.55);
    }
    .action-sheet.show { transform: translate(-50%, 0); }
    .sheet-handle { width: 42px; height: 4px; margin: 2px auto 18px; border-radius: 99px; background: rgba(255,255,255,.22); }
    .sheet-track { display: grid; grid-template-columns: 54px minmax(0,1fr); gap: 13px; align-items: center; margin: 0 4px 14px; }
    .sheet-cover { width: 54px; height: 54px; border-radius: 13px; }
    .sheet-track strong, .sheet-track span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sheet-track span { margin-top: 5px; color: var(--muted); font-size: 13px; }
    .sheet-actions { display: grid; gap: 7px; }
    .sheet-actions button { min-height: 52px; padding: 0 16px; border: 0; border-radius: 15px; background: rgba(255,255,255,.065); text-align: left; font-weight: 650; cursor: pointer; }
    .sheet-actions button.danger { color: #ff6b73; }
    .sheet-actions button:disabled { opacity: .34; cursor: default; }

    .busy {
      position: fixed;
      z-index: 300;
      inset: 0;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 15px;
      background: rgba(0,0,0,.80);
      backdrop-filter: blur(12px);
    }
    .spinner { width: 38px; height: 38px; border: 3px solid rgba(255,255,255,.15); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; }
    .busy span { color: rgba(255,255,255,.72); font-size: 14px; }

    .toast {
      position: fixed;
      z-index: 400;
      left: 50%;
      top: calc(16px + env(safe-area-inset-top, 0px));
      transform: translate(-50%, -18px);
      max-width: calc(100% - 28px);
      padding: 11px 15px;
      border: 1px solid rgba(255,255,255,.11);
      border-radius: 14px;
      background: rgba(25,25,28,.94);
      color: #fff;
      font-size: 13px;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .24s ease, transform .24s ease;
      box-shadow: 0 16px 44px rgba(0,0,0,.48);
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes breathe { 50% { transform: translateY(-7px); box-shadow: inset 0 0 0 1px rgba(255,255,255,.04), 0 38px 100px rgba(var(--accent-rgb), .08); } }
    @keyframes rowIn { from { opacity: 0; transform: translateY(8px); } }
    @keyframes miniIn { from { opacity: 0; transform: translate(-50%, 16px); } }
    @keyframes eq { from { height: 4px; } to { height: 12px; } }

    @media (max-height: 670px) {
      .player-content { grid-template-rows: minmax(185px, 1fr) auto auto auto; padding-top: 6px; }
      .art-card { width: min(58vw, 285px, 38vh); }
      .primary-control { width: 64px; height: 64px; }
      .controls { margin-top: 8px; }
      .timeline { margin-top: 12px; }
      .player-meta { margin-top: 8px; }
    }
    @media (min-width: 800px) {
      .shell { padding-left: 28px; padding-right: 28px; }
      .track-list { grid-template-columns: 1fr 1fr; gap: 8px 12px; }
      .empty-art { width: 300px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <noscript>
    <div style="position:fixed;z-index:9999;inset:0;display:grid;place-content:center;padding:28px;background:#000;color:#fff;text-align:center;font:16px/1.5 system-ui,sans-serif">
      Цей переглядач блокує JavaScript. Завантаж файл і відкрий його через Chrome, а не у вбудованому перегляді.
    </div>
  </noscript>
  <div class="app" id="app">
    <div class="shell">
      <header class="topbar">
        <h1 class="brand">BY NOFI4KA</h1>
        <span class="round-button file-picker" id="addButton" aria-label="Додати музику" title="Додати музику" role="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M11 5a1 1 0 0 1 2 0v6h6a1 1 0 1 1 0 2h-6v6a1 1 0 1 1-2 0v-6H5a1 1 0 1 1 0-2h6V5Z"/></svg>
          <input class="native-file-input" id="fileInputTop" type="file" multiple aria-label="Додати музику">
        </span>
      </header>

      <main id="libraryView">
        <section class="empty" id="emptyState">
          <div class="empty-art">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M18 3v11.55A4 4 0 1 1 16 11V6.45l-8 1.78v8.32A4 4 0 1 1 6 13V6.62L18 3Zm-2 10.05A2 2 0 1 0 16 17a2 2 0 0 0 0-3.95ZM6 15.05A2 2 0 1 0 6 19a2 2 0 0 0 0-3.95Z"/></svg>
          </div>
          <h2>Тут буде твоя музика</h2>
          <p>Додай аудіофайли з пристрою</p>
          <span class="add-large file-picker" id="emptyAddButton" role="button">
            + Додати музику
            <input class="native-file-input" id="fileInputEmpty" type="file" multiple aria-label="Додати музику">
          </span>
        </section>

        <section id="libraryContent" hidden>
          <div class="library-heading">
            <h2>Моя музика</h2>
            <span id="trackCount">0 треків</span>
          </div>
          <div class="track-list" id="trackList"></div>
        </section>
      </main>
    </div>

    <div class="mini-player" id="miniPlayer" hidden role="button" tabindex="0" aria-label="Відкрити плеєр">
      <div class="mini-cover" id="miniCover"></div>
      <div class="mini-text">
        <div class="mini-title" id="miniTitle">—</div>
        <div class="mini-artist" id="miniArtist">—</div>
      </div>
      <div class="mini-actions">
        <button id="miniPrev" aria-label="Попередній трек">
          <svg viewBox="0 0 24 24"><path fill="currentColor" d="M6 5h2v14H6V5Zm3 7 10-7v14L9 12Z"/></svg>
        </button>
        <button id="miniPlay" aria-label="Відтворити"></button>
      </div>
    </div>

    <section class="player-view" id="playerView" aria-label="Музичний програвач">
      <div class="player-top">
        <button id="closePlayer" aria-label="Згорнути плеєр">
          <svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m5 9 7 7 7-7"/></svg>
        </button>
        <div class="player-top-title"><strong>Зараз грає</strong><span>Свайпни вниз, щоб згорнути</span></div>
        <span></span>
      </div>

      <div class="player-content" id="playerContent">
        <div class="art-stage" id="artStage">
          <div class="art-card" id="artCard">
            <div id="playerCover" style="width:100%;height:100%"></div>
            <div class="cover-shine"></div>
          </div>
        </div>

        <div class="player-meta">
          <h2 class="player-title" id="playerTitle">—</h2>
          <p class="player-artist" id="playerArtist">—</p>
        </div>

        <div class="timeline">
          <div class="range-wrap">
            <div class="range-track"><div class="range-fill" id="rangeFill"></div></div>
            <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Позиція треку">
          </div>
          <div class="time-row"><span id="currentTime">0:00</span><span id="duration">0:00</span></div>
        </div>

        <div class="controls">
          <button class="icon-button" id="repeatButton" aria-label="Режим повторення" title="Повторення вимкнено">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M7 7h9.17L14.6 5.43 16 4l4 4-4 4-1.4-1.43L16.17 9H7a3 3 0 0 0-3 3v1H2v-1a5 5 0 0 1 5-5Zm10 10H7.83l1.57 1.57L8 20l-4-4 4-4 1.4 1.43L7.83 15H17a3 3 0 0 0 3-3v-1h2v1a5 5 0 0 1-5 5Z"/></svg>
            <span class="repeat-badge" id="repeatBadge"></span>
          </button>
          <button class="icon-button" id="prevButton" aria-label="Попередній трек">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M6 5h2v14H6V5Zm3 7 10-7v14L9 12Z"/></svg>
          </button>
          <button class="primary-control" id="playButton" aria-label="Відтворити"></button>
          <button class="icon-button" id="nextButton" aria-label="Наступний трек">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M16 5h2v14h-2V5ZM5 5l10 7-10 7V5Z"/></svg>
          </button>
          <button class="icon-button" id="libraryButton" aria-label="Відкрити бібліотеку">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M4 5h16v2H4V5Zm0 6h16v2H4v-2Zm0 6h10v2H4v-2Z"/></svg>
          </button>
        </div>
      </div>
    </section>

    <div class="scrim" id="scrim"></div>
    <aside class="action-sheet" id="actionSheet" aria-label="Дії з треком">
      <div class="sheet-handle"></div>
      <div class="sheet-track">
        <div class="sheet-cover" id="sheetCover"></div>
        <div><strong id="sheetTitle">—</strong><span id="sheetArtist">—</span></div>
      </div>
      <div class="sheet-actions">
        <button id="moveUp">Перемістити вище</button>
        <button id="moveDown">Перемістити нижче</button>
        <button class="danger" id="deleteTrack">Видалити зі списку</button>
      </div>
    </aside>

    <div class="busy" id="busy" hidden><div class="spinner"></div><span id="busyText">Обробка музики…</span></div>
    <div class="toast" id="toast"></div>
  </div>

  <script>
    "use strict";

    const $ = (selector) => document.querySelector(selector);
    const DB_NAME = "by-nofi4ka-library";
    const DB_VERSION = 1;
    const CACHE_KEY = "by-nofi4ka-catalog-v1";
    const DEFAULT_COLOR = "#9272ff";
    const AUDIO_EXTENSIONS = new Set(["mp3", "m4a", "aac", "wav", "wave", "ogg", "oga", "opus", "flac", "webm"]);
    const audio = new Audio();
    audio.preload = "metadata";

    const state = {
      db: null,
      tracks: [],
      currentIndex: -1,
      playing: false,
      repeat: "off",
      actionTrackId: null,
      transitioning: false,
      dbFailed: false,
      saveTimer: 0,
      toastTimer: 0,
      restorePosition: 0
    };

    const icons = {
      play: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7L8 5Z"/></svg>',
      pause: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 5h4v14H7V5Zm6 0h4v14h-4V5Z"/></svg>',
      note: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M18 3v11.55A4 4 0 1 1 16 11V6.45l-8 1.78v8.32A4 4 0 1 1 6 13V6.62L18 3Z"/></svg>'
    };

    function escapeHtml(value = "") {
      return String(value).replace(/[&<>'"]/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"})[char]);
    }

    function formatTime(seconds) {
      if (!Number.isFinite(seconds) || seconds < 0) return "0:00";
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60).toString().padStart(2, "0");
      return `${m}:${s}`;
    }

    function trackWord(count) {
      const n10 = count % 10;
      const n100 = count % 100;
      if (n10 === 1 && n100 !== 11) return "трек";
      if (n10 >= 2 && n10 <= 4 && !(n100 >= 12 && n100 <= 14)) return "треки";
      return "треків";
    }

    function rgbFromHex(hex) {
      const clean = String(hex || DEFAULT_COLOR).replace("#", "");
      const value = clean.length === 3 ? clean.split("").map(x => x + x).join("") : clean;
      const n = Number.parseInt(value, 16);
      return Number.isFinite(n) ? `${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}` : "146, 114, 255";
    }

    function setTheme(color) {
      const safe = /^#[0-9a-f]{6}$/i.test(color || "") ? color : DEFAULT_COLOR;
      document.documentElement.style.setProperty("--accent", safe);
      document.documentElement.style.setProperty("--accent-rgb", rgbFromHex(safe));
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.content = "#000000";
    }

    function showToast(message) {
      const el = $("#toast");
      el.textContent = message;
      el.classList.add("show");
      clearTimeout(state.toastTimer);
      state.toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
    }

    function setBusy(show, text = "Обробка музики…") {
      $("#busyText").textContent = text;
      $("#busy").hidden = !show;
    }

    function openDatabase() {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) return reject(new Error("IndexedDB недоступний"));
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = () => {
          const db = request.result;
          if (!db.objectStoreNames.contains("tracks")) {
            const store = db.createObjectStore("tracks", { keyPath: "id" });
            store.createIndex("order", "order", { unique: false });
          }
          if (!db.objectStoreNames.contains("settings")) db.createObjectStore("settings", { keyPath: "key" });
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error || new Error("Не вдалося відкрити бібліотеку"));
      });
    }

    function dbRequest(storeName, mode, operation) {
      return new Promise((resolve, reject) => {
        const tx = state.db.transaction(storeName, mode);
        const store = tx.objectStore(storeName);
        let request;
        try { request = operation(store); } catch (error) { reject(error); return; }
        if (request) {
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        } else {
          tx.oncomplete = () => resolve();
        }
        tx.onerror = () => reject(tx.error);
      });
    }

    const getAllTracks = () => dbRequest("tracks", "readonly", store => store.getAll());
    const putTrack = track => dbRequest("tracks", "readwrite", store => store.put(serializableTrack(track)));
    const removeTrackFromDb = id => dbRequest("tracks", "readwrite", store => store.delete(id));
    const getSetting = key => dbRequest("settings", "readonly", store => store.get(key));
    const putSetting = (key, value) => dbRequest("settings", "readwrite", store => store.put({ key, value }));

    function serializableTrack(track) {
      const result = { ...track };
      for (const key of Object.keys(result)) if (key.startsWith("_")) delete result[key];
      return result;
    }

    function writeCatalogCache() {
      try {
        const compact = state.tracks.map(({ id, title, artist, album, duration, color, thumb, order, fileName }) => ({
          id, title, artist, album, duration, color, thumb, order, fileName
        }));
        localStorage.setItem(CACHE_KEY, JSON.stringify(compact));
      } catch {
        try {
          const tiny = state.tracks.map(({ id, title, artist, album, duration, color, order, fileName }) => ({ id, title, artist, album, duration, color, order, fileName }));
          localStorage.setItem(CACHE_KEY, JSON.stringify(tiny));
        } catch { /* cache is optional */ }
      }
    }

    function readCatalogCache() {
      try {
        const data = JSON.parse(localStorage.getItem(CACHE_KEY) || "[]");
        return Array.isArray(data) ? data.map(track => ({ ...track, _cached: true })) : [];
      } catch { return []; }
    }

    function coverMarkup(track, className = "") {
      if (track?.thumb) return `<img class="${className}" src="${track.thumb}" alt="" draggable="false">`;
      if (track?.coverBlob) {
        if (!track._coverUrl) track._coverUrl = URL.createObjectURL(track.coverBlob);
        return `<img class="${className}" src="${track._coverUrl}" alt="" draggable="false">`;
      }
      const rgb = rgbFromHex(track?.color || DEFAULT_COLOR);
      return `<div class="cover-fallback" style="--row-rgb:${rgb}">${icons.note}</div>`;
    }

    function renderLibrary() {
      const hasTracks = state.tracks.length > 0;
      $("#emptyState").hidden = hasTracks;
      $("#libraryContent").hidden = !hasTracks;
      $("#trackCount").textContent = `${state.tracks.length} ${trackWord(state.tracks.length)}`;
      if (!hasTracks) {
        $("#trackList").innerHTML = "";
        $("#miniPlayer").hidden = true;
        return;
      }

      $("#trackList").innerHTML = state.tracks.map((track, index) => {
        const active = index === state.currentIndex;
        return `
          <button class="track-row${active ? " active" : ""}${active && state.playing ? " playing" : ""}"
                  data-id="${escapeHtml(track.id)}" style="animation-delay:${Math.min(index * 24, 220)}ms">
            <span class="track-cover">
              ${coverMarkup(track)}
              <span class="equalizer"><i></i><i></i><i></i></span>
            </span>
            <span class="track-text">
              <span class="track-title">${escapeHtml(track.title || "Без назви")}</span>
              <span class="track-artist">${escapeHtml(track.artist || "Невідомий виконавець")}</span>
            </span>
            <span class="track-duration">${formatTime(track.duration)}</span>
          </button>`;
      }).join("");

      bindTrackRows();
      updateMiniPlayer();
    }

    function bindTrackRows() {
      $("#trackList").querySelectorAll(".track-row").forEach(row => {
        let timer = 0;
        let startX = 0;
        let startY = 0;
        let longPressed = false;
        const cancel = () => { clearTimeout(timer); timer = 0; };

        row.addEventListener("pointerdown", event => {
          if (event.pointerType === "mouse" && event.button !== 0) return;
          startX = event.clientX;
          startY = event.clientY;
          longPressed = false;
          timer = window.setTimeout(() => {
            longPressed = true;
            if (navigator.vibrate) navigator.vibrate(25);
            openActionSheet(row.dataset.id);
          }, 560);
        });
        row.addEventListener("pointermove", event => {
          if (Math.hypot(event.clientX - startX, event.clientY - startY) > 10) cancel();
        });
        row.addEventListener("pointerup", cancel);
        row.addEventListener("pointercancel", cancel);
        row.addEventListener("contextmenu", event => {
          event.preventDefault();
          openActionSheet(row.dataset.id);
        });
        row.addEventListener("click", () => {
          if (longPressed) { longPressed = false; return; }
          const index = state.tracks.findIndex(track => track.id === row.dataset.id);
          if (index < 0) return;
          if (state.tracks[index]._cached) { showToast("Бібліотека ще завантажується"); return; }
          selectTrack(index, true, 0);
          openPlayer();
        });
      });
    }

    function ensureAudioUrl(track) {
      if (!track?.audioBlob) return "";
      if (!track._audioUrl) track._audioUrl = URL.createObjectURL(track.audioBlob);
      return track._audioUrl;
    }

    function currentTrack() { return state.tracks[state.currentIndex] || null; }

    async function selectTrack(index, autoplay = true, position = 0) {
      const track = state.tracks[index];
      if (!track || !track.audioBlob) return;
      const changed = state.currentIndex !== index || audio.dataset.trackId !== track.id;
      state.currentIndex = index;
      setTheme(track.color);

      if (changed) {
        audio.src = ensureAudioUrl(track);
        audio.dataset.trackId = track.id;
        audio.load();
        if (position > 0) {
          const restore = () => {
            audio.currentTime = Math.min(position, Math.max(0, (audio.duration || position) - .5));
            audio.removeEventListener("loadedmetadata", restore);
          };
          audio.addEventListener("loadedmetadata", restore);
        }
      }

      updatePlayerUi();
      updateMediaSession();
      scheduleStateSave();
      if (autoplay) {
        try { await audio.play(); }
        catch (error) { showToast("Браузер не зміг відтворити цей формат"); }
      }
    }

    async function togglePlay() {
      if (state.currentIndex < 0 && state.tracks.length) await selectTrack(0, true, 0);
      else if (audio.paused) {
        try { await audio.play(); } catch { showToast("Натисни ще раз або перевір формат файлу"); }
      } else audio.pause();
    }

    function targetIndex(direction, automatic = false) {
      if (!state.tracks.length) return -1;
      let target = state.currentIndex + direction;
      if (target < 0) target = state.tracks.length - 1;
      if (target >= state.tracks.length) {
        if (automatic && state.repeat === "off") return -1;
        target = 0;
      }
      return target;
    }

    function changeTrack(direction, automatic = false) {
      if (state.transitioning || !state.tracks.length) return;
      if (direction < 0 && audio.currentTime > 3 && !automatic) {
        audio.currentTime = 0;
        return;
      }
      const target = targetIndex(direction, automatic);
      if (target < 0) { audio.pause(); audio.currentTime = audio.duration || 0; return; }
      animateTrackChange(direction, () => selectTrack(target, true, 0));
    }

    async function animateTrackChange(direction, change) {
      const card = $("#artCard");
      if (!card.animate || matchMedia("(prefers-reduced-motion: reduce)").matches) { await change(); return; }
      state.transitioning = true;
      const exitSign = direction > 0 ? -1 : 1;
      const exit = card.animate([
        { transform: "translateX(0) rotate(0deg)", opacity: 1 },
        { transform: `translateX(${exitSign * 115}%) rotate(${exitSign * 18}deg)`, opacity: 0 }
      ], { duration: 290, easing: "cubic-bezier(.4,0,.7,.2)", fill: "forwards" });
      await exit.finished.catch(() => {});
      await change();
      exit.cancel();
      const enter = card.animate([
        { transform: `translateX(${-exitSign * 110}%) rotate(${-exitSign * 17}deg)`, opacity: 0 },
        { transform: "translateX(0) rotate(0deg)", opacity: 1 }
      ], { duration: 430, easing: "cubic-bezier(.16,.84,.2,1)", fill: "forwards" });
      await enter.finished.catch(() => {});
      enter.cancel();
      state.transitioning = false;
    }

    function updatePlayerUi() {
      const track = currentTrack();
      const has = !!track;
      $("#miniPlayer").hidden = !has;
      if (!has) return;
      $("#playerCover").innerHTML = coverMarkup(track, "cover-image");
      $("#playerTitle").textContent = track.title || "Без назви";
      $("#playerArtist").textContent = track.artist || "Невідомий виконавець";
      $("#miniCover").innerHTML = coverMarkup(track);
      $("#miniTitle").textContent = track.title || "Без назви";
      $("#miniArtist").textContent = track.artist || "Невідомий виконавець";
      updatePlayIcons();
      updateRepeatUi();
      updateTimeline();
      renderLibrary();
    }

    function updateMiniPlayer() {
      const track = currentTrack();
      if (!track) { $("#miniPlayer").hidden = true; return; }
      $("#miniPlayer").hidden = false;
      $("#miniCover").innerHTML = coverMarkup(track);
      $("#miniTitle").textContent = track.title || "Без назви";
      $("#miniArtist").textContent = track.artist || "Невідомий виконавець";
      updatePlayIcons();
    }

    function updatePlayIcons() {
      const icon = state.playing ? icons.pause : icons.play;
      $("#playButton").innerHTML = icon;
      $("#miniPlay").innerHTML = icon;
      $("#playButton").setAttribute("aria-label", state.playing ? "Пауза" : "Відтворити");
      $("#miniPlay").setAttribute("aria-label", state.playing ? "Пауза" : "Відтворити");
      document.querySelectorAll(".track-row").forEach((row, index) => {
        row.classList.toggle("active", index === state.currentIndex);
        row.classList.toggle("playing", index === state.currentIndex && state.playing);
      });
    }

    function updateTimeline() {
      const duration = Number.isFinite(audio.duration) ? audio.duration : (currentTrack()?.duration || 0);
      const current = Number.isFinite(audio.currentTime) ? audio.currentTime : 0;
      const ratio = duration > 0 ? Math.min(1, current / duration) : 0;
      $("#rangeFill").style.width = `${ratio * 100}%`;
      $("#seek").value = Math.round(ratio * 1000);
      $("#currentTime").textContent = formatTime(current);
      $("#duration").textContent = formatTime(duration);
      updatePositionState();
    }

    function cycleRepeat() {
      state.repeat = state.repeat === "off" ? "all" : state.repeat === "all" ? "one" : "off";
      updateRepeatUi();
      putSetting("repeat", state.repeat).catch(() => {});
    }

    function updateRepeatUi() {
      const button = $("#repeatButton");
      const badge = $("#repeatBadge");
      button.classList.toggle("active", state.repeat !== "off");
      badge.textContent = state.repeat === "one" ? "1" : state.repeat === "all" ? "∞" : "";
      const labels = { off: "Повторення вимкнено", all: "Повторювати весь список", one: "Повторювати поточний трек" };
      button.title = labels[state.repeat];
      button.setAttribute("aria-label", labels[state.repeat]);
    }

    function openPlayer() {
      if (!currentTrack()) return;
      $("#playerView").classList.add("open");
      document.body.style.overflow = "hidden";
    }

    function closePlayer() {
      $("#playerView").classList.remove("open");
      document.body.style.overflow = "";
    }

    function openActionSheet(id) {
      const index = state.tracks.findIndex(track => track.id === id);
      const track = state.tracks[index];
      if (!track) return;
      state.actionTrackId = id;
      $("#sheetCover").innerHTML = coverMarkup(track);
      $("#sheetTitle").textContent = track.title || "Без назви";
      $("#sheetArtist").textContent = track.artist || "Невідомий виконавець";
      $("#moveUp").disabled = index <= 0;
      $("#moveDown").disabled = index >= state.tracks.length - 1;
      $("#scrim").classList.add("show");
      $("#actionSheet").classList.add("show");
    }

    function closeActionSheet() {
      $("#scrim").classList.remove("show");
      $("#actionSheet").classList.remove("show");
      window.setTimeout(() => state.actionTrackId = null, 300);
    }

    async function moveActionTrack(direction) {
      const from = state.tracks.findIndex(track => track.id === state.actionTrackId);
      const to = from + direction;
      if (from < 0 || to < 0 || to >= state.tracks.length) return;
      const currentId = currentTrack()?.id;
      [state.tracks[from], state.tracks[to]] = [state.tracks[to], state.tracks[from]];
      state.tracks.forEach((track, index) => track.order = index);
      state.currentIndex = currentId ? state.tracks.findIndex(track => track.id === currentId) : -1;
      renderLibrary();
      writeCatalogCache();
      closeActionSheet();
      try { await Promise.all(state.tracks.map(putTrack)); } catch { showToast("Не вдалося зберегти новий порядок"); }
    }

    async function deleteActionTrack() {
      const index = state.tracks.findIndex(track => track.id === state.actionTrackId);
      if (index < 0) return;
      const track = state.tracks[index];
      const wasCurrent = index === state.currentIndex;
      closeActionSheet();
      try {
        await removeTrackFromDb(track.id);
        if (track._audioUrl) URL.revokeObjectURL(track._audioUrl);
        if (track._coverUrl) URL.revokeObjectURL(track._coverUrl);
        state.tracks.splice(index, 1);
        state.tracks.forEach((item, i) => item.order = i);
        if (wasCurrent) {
          audio.pause();
          audio.removeAttribute("src");
          audio.load();
          state.currentIndex = -1;
          if (state.tracks.length) await selectTrack(Math.min(index, state.tracks.length - 1), false, 0);
          else closePlayer();
        } else if (state.currentIndex > index) state.currentIndex--;
        renderLibrary();
        writeCatalogCache();
        await Promise.all(state.tracks.map(putTrack));
        showToast("Трек видалено зі списку");
      } catch { showToast("Не вдалося видалити трек"); }
    }

    function scheduleStateSave() {
      clearTimeout(state.saveTimer);
      state.saveTimer = window.setTimeout(() => {
        const track = currentTrack();
        if (!state.db || !track) return;
        putSetting("player", { trackId: track.id, position: audio.currentTime || 0 }).catch(() => {});
      }, 700);
    }

    function updateMediaSession() {
      if (!("mediaSession" in navigator)) return;
      const track = currentTrack();
      if (!track) return;
      const artwork = [];
      const image = track.thumb || (track.coverBlob ? (track._coverUrl ||= URL.createObjectURL(track.coverBlob)) : "");
      if (image) artwork.push({ src: image, sizes: "512x512", type: track.coverBlob?.type || "image/jpeg" });
      try {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: track.title || "Без назви",
          artist: track.artist || "Невідомий виконавець",
          album: track.album || "BY NOFI4KA",
          artwork
        });
      } catch { /* MediaMetadata may reject blob URLs in some browsers */ }
    }

    function updatePositionState() {
      if (!("mediaSession" in navigator) || !navigator.mediaSession.setPositionState) return;
      if (!Number.isFinite(audio.duration) || audio.duration <= 0) return;
      try {
        navigator.mediaSession.setPositionState({
          duration: audio.duration,
          playbackRate: audio.playbackRate,
          position: Math.min(audio.currentTime, audio.duration)
        });
      } catch { /* unsupported in some WebViews */ }
    }

    function configureMediaSession() {
      if (!("mediaSession" in navigator)) return;
      const handlers = {
        play: () => audio.play(),
        pause: () => audio.pause(),
        previoustrack: () => changeTrack(-1),
        nexttrack: () => changeTrack(1),
        seekbackward: details => audio.currentTime = Math.max(0, audio.currentTime - (details.seekOffset || 10)),
        seekforward: details => audio.currentTime = Math.min(audio.duration || Infinity, audio.currentTime + (details.seekOffset || 10)),
        seekto: details => {
          if (details.fastSeek && "fastSeek" in audio) audio.fastSeek(details.seekTime);
          else audio.currentTime = details.seekTime;
        },
        stop: () => { audio.pause(); audio.currentTime = 0; }
      };
      Object.entries(handlers).forEach(([action, handler]) => {
        try { navigator.mediaSession.setActionHandler(action, handler); } catch { /* action unsupported */ }
      });
    }

    function bytesToText(bytes, encoding = "utf-8") {
      try { return new TextDecoder(encoding).decode(bytes).replace(/\0+$/g, "").trim(); }
      catch { return Array.from(bytes, byte => String.fromCharCode(byte)).join("").replace(/\0+$/g, "").trim(); }
    }

    function encodedText(bytes) {
      if (!bytes?.length) return "";
      const encoding = bytes[0];
      let body = bytes.subarray(1);
      if (encoding === 0) return bytesToText(body, "iso-8859-1").replace(/\0/g, "").trim();
      if (encoding === 3) return bytesToText(body, "utf-8").replace(/\0/g, "").trim();
      if (encoding === 2) return bytesToText(body, "utf-16be").replace(/\0/g, "").trim();
      if (body[0] === 0xff && body[1] === 0xfe) return bytesToText(body.subarray(2), "utf-16le").replace(/\0/g, "").trim();
      if (body[0] === 0xfe && body[1] === 0xff) return bytesToText(body.subarray(2), "utf-16be").replace(/\0/g, "").trim();
      return bytesToText(body, "utf-16le").replace(/\0/g, "").trim();
    }

    const be32 = (data, offset) => (((data[offset] << 24) >>> 0) + (data[offset + 1] << 16) + (data[offset + 2] << 8) + data[offset + 3]) >>> 0;
    const le32 = (data, offset) => (data[offset] + (data[offset + 1] << 8) + (data[offset + 2] << 16) + ((data[offset + 3] << 24) >>> 0)) >>> 0;
    const syncSafe = (data, offset) => (data[offset] << 21) | (data[offset + 1] << 14) | (data[offset + 2] << 7) | data[offset + 3];
    const ascii = (data, offset, length) => Array.from(data.subarray(offset, offset + length), b => String.fromCharCode(b)).join("");

    function imageMime(bytes, declared = "") {
      if (bytes?.[0] === 0x89 && bytes?.[1] === 0x50 && bytes?.[2] === 0x4e && bytes?.[3] === 0x47) return "image/png";
      if (bytes?.[0] === 0xff && bytes?.[1] === 0xd8 && bytes?.[2] === 0xff) return "image/jpeg";
      if (ascii(bytes || new Uint8Array(), 0, 4) === "GIF8") return "image/gif";
      if (ascii(bytes || new Uint8Array(), 0, 4) === "RIFF" && ascii(bytes, 8, 4) === "WEBP") return "image/webp";
      const normalized = String(declared || "").toLowerCase().replace("image/jpg", "image/jpeg");
      return normalized.startsWith("image/") ? normalized : "image/jpeg";
    }

    function findTerminator(data, offset, wide) {
      if (wide) {
        for (let i = offset; i + 1 < data.length; i += 2) if (data[i] === 0 && data[i + 1] === 0) return i;
      } else {
        for (let i = offset; i < data.length; i++) if (data[i] === 0) return i;
      }
      return data.length;
    }

    function parsePictureBlock(data) {
      try {
        let p = 0;
        p += 4;
        const mimeLength = be32(data, p); p += 4;
        const mime = ascii(data, p, mimeLength); p += mimeLength;
        const descriptionLength = be32(data, p); p += 4 + descriptionLength;
        p += 16;
        const imageLength = be32(data, p); p += 4;
        if (!imageLength || p + imageLength > data.length) return null;
        const picture = data.slice(p, p + imageLength);
        return new Blob([picture], { type: imageMime(picture, mime) });
      } catch { return null; }
    }

    function parseId3(data) {
      const result = {};
      if (ascii(data, 0, 3) !== "ID3") return result;
      const version = data[3];
      const tagEnd = Math.min(data.length, 10 + syncSafe(data, 6));
      let offset = 10;
      if (data[5] & 0x40) {
        const extendedSize = version === 4 ? syncSafe(data, offset) : be32(data, offset);
        offset += version === 3 ? 4 + extendedSize : extendedSize;
      }
      while (offset + (version === 2 ? 6 : 10) <= tagEnd) {
        const idLength = version === 2 ? 3 : 4;
        const frameId = ascii(data, offset, idLength);
        if (!/^[A-Z0-9©]{3,4}$/.test(frameId)) break;
        const size = version === 2 ? (data[offset + 3] << 16) | (data[offset + 4] << 8) | data[offset + 5]
          : version === 4 ? syncSafe(data, offset + 4) : be32(data, offset + 4);
        const header = version === 2 ? 6 : 10;
        const body = data.subarray(offset + header, Math.min(offset + header + size, tagEnd));
        if (!size) break;
        if (["TIT2", "TT2"].includes(frameId)) result.title = encodedText(body);
        else if (["TPE1", "TP1"].includes(frameId)) result.artist = encodedText(body).replace(/\0/g, " / ");
        else if (["TALB", "TAL"].includes(frameId)) result.album = encodedText(body);
        else if (["APIC", "PIC"].includes(frameId) && body.length > 8) {
          const encoding = body[0];
          let p = 1;
          let mime = "image/jpeg";
          if (frameId === "PIC") {
            const format = ascii(body, p, 3).toLowerCase(); p += 3;
            mime = format.includes("png") ? "image/png" : "image/jpeg";
          } else {
            const mimeEnd = findTerminator(body, p, false);
            mime = bytesToText(body.subarray(p, mimeEnd), "iso-8859-1") || mime;
            p = mimeEnd + 1;
          }
          p += 1;
          const wide = encoding === 1 || encoding === 2;
          const descriptionEnd = findTerminator(body, p, wide);
          p = Math.min(body.length, descriptionEnd + (wide ? 2 : 1));
          if (p < body.length) {
            const picture = body.slice(p);
            result.coverBlob = new Blob([picture], { type: imageMime(picture, mime) });
          }
        }
        offset += header + size;
      }
      return result;
    }

    function applyComments(result, comments) {
      for (const comment of comments) {
        const at = comment.indexOf("=");
        if (at <= 0) continue;
        const key = comment.slice(0, at).toUpperCase();
        const value = comment.slice(at + 1).trim();
        if (key === "TITLE" && !result.title) result.title = value;
        if (["ARTIST", "ALBUMARTIST"].includes(key) && !result.artist) result.artist = value;
        if (key === "ALBUM" && !result.album) result.album = value;
        if (key === "METADATA_BLOCK_PICTURE" && !result.coverBlob) {
          try {
            const binary = atob(value);
            const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
            result.coverBlob = parsePictureBlock(bytes);
          } catch { /* invalid picture */ }
        }
      }
    }

    function parseVorbisCommentBlock(data, offset = 0) {
      const comments = [];
      if (offset + 4 > data.length) return comments;
      const vendorLength = le32(data, offset); offset += 4 + vendorLength;
      if (offset + 4 > data.length) return comments;
      const count = Math.min(le32(data, offset), 10000); offset += 4;
      for (let i = 0; i < count && offset + 4 <= data.length; i++) {
        const length = le32(data, offset); offset += 4;
        if (length > data.length - offset) break;
        comments.push(bytesToText(data.subarray(offset, offset + length), "utf-8"));
        offset += length;
      }
      return comments;
    }

    function parseFlac(data) {
      const result = {};
      if (ascii(data, 0, 4) !== "fLaC") return result;
      let offset = 4;
      let last = false;
      while (!last && offset + 4 <= data.length) {
        last = !!(data[offset] & 0x80);
        const type = data[offset] & 0x7f;
        const length = (data[offset + 1] << 16) | (data[offset + 2] << 8) | data[offset + 3];
        const block = data.subarray(offset + 4, Math.min(data.length, offset + 4 + length));
        if (type === 4) applyComments(result, parseVorbisCommentBlock(block));
        if (type === 6 && !result.coverBlob) result.coverBlob = parsePictureBlock(block);
        offset += 4 + length;
      }
      return result;
    }

    function findPattern(data, pattern) {
      outer: for (let i = 0; i <= data.length - pattern.length; i++) {
        for (let j = 0; j < pattern.length; j++) if (data[i + j] !== pattern[j]) continue outer;
        return i;
      }
      return -1;
    }

    function parseOgg(data) {
      const result = {};
      const vorbisPattern = [3, 118, 111, 114, 98, 105, 115];
      const opusPattern = Array.from("OpusTags", c => c.charCodeAt(0));
      let offset = findPattern(data, vorbisPattern);
      if (offset >= 0) offset += vorbisPattern.length;
      else {
        offset = findPattern(data, opusPattern);
        if (offset >= 0) offset += opusPattern.length;
      }
      if (offset >= 0) applyComments(result, parseVorbisCommentBlock(data, offset));
      return result;
    }

    function parseMp4(data) {
      const result = {};
      const containers = new Set(["moov", "udta", "ilst", "trak", "mdia", "minf", "stbl"]);
      const tags = new Set(["©nam", "©ART", "aART", "©alb", "covr"]);

      function walk(start, end, parent = "", depth = 0) {
        if (depth > 12) return;
        let offset = start;
        while (offset + 8 <= end) {
          let size = be32(data, offset);
          const type = ascii(data, offset + 4, 4);
          let header = 8;
          if (size === 1 && offset + 16 <= end) {
            const high = be32(data, offset + 8);
            const low = be32(data, offset + 12);
            if (high > 0x1fffff) break;
            size = high * 4294967296 + low;
            header = 16;
          }
          if (!size) size = end - offset;
          if (size < header || offset + size > end) break;
          let contentStart = offset + header;
          const boxEnd = offset + size;

          if (type === "meta") walk(contentStart + 4, boxEnd, type, depth + 1);
          else if (containers.has(type)) walk(contentStart, boxEnd, type, depth + 1);
          else if (tags.has(type)) walk(contentStart, boxEnd, type, depth + 1);
          else if (type === "data" && tags.has(parent)) {
            const valueStart = contentStart + 8;
            if (valueStart < boxEnd) {
              const value = data.subarray(valueStart, boxEnd);
              if (parent === "©nam") result.title = bytesToText(value, "utf-8");
              if (["©ART", "aART"].includes(parent) && !result.artist) result.artist = bytesToText(value, "utf-8");
              if (parent === "©alb") result.album = bytesToText(value, "utf-8");
              if (parent === "covr" && !result.coverBlob) {
                const picture = value.slice();
                result.coverBlob = new Blob([picture], { type: imageMime(picture) });
              }
            }
          }
          offset += size;
        }
      }
      walk(0, data.length);
      return result;
    }

    function parseWav(data) {
      const result = {};
      if (ascii(data, 0, 4) !== "RIFF" || ascii(data, 8, 4) !== "WAVE") return result;
      let offset = 12;
      while (offset + 8 <= data.length) {
        const id = ascii(data, offset, 4);
        const size = le32(data, offset + 4);
        const body = data.subarray(offset + 8, Math.min(data.length, offset + 8 + size));
        if (id.trim().toLowerCase() === "id3") Object.assign(result, parseId3(body));
        if (id === "LIST" && ascii(body, 0, 4) === "INFO") {
          let p = 4;
          while (p + 8 <= body.length) {
            const key = ascii(body, p, 4);
            const length = le32(body, p + 4);
            const value = bytesToText(body.subarray(p + 8, Math.min(body.length, p + 8 + length)), "utf-8").replace(/\0/g, "");
            if (key === "INAM") result.title = value;
            if (key === "IART") result.artist = value;
            if (key === "IPRD") result.album = value;
            p += 8 + length + (length % 2);
          }
        }
        offset += 8 + size + (size % 2);
      }
      return result;
    }

    async function extractMetadata(file) {
      const buffer = await file.arrayBuffer();
      const data = new Uint8Array(buffer);
      let result = {};
      const signature = ascii(data, 0, Math.min(12, data.length));
      if (signature.startsWith("ID3") || file.name.toLowerCase().endsWith(".mp3")) result = parseId3(data);
      else if (signature.startsWith("fLaC")) result = parseFlac(data);
      else if (signature.startsWith("OggS")) result = parseOgg(data);
      else if (signature.startsWith("RIFF")) result = parseWav(data);
      else if (ascii(data, 4, 4) === "ftyp") result = parseMp4(data);

      if (!result.title && data.length >= 128 && ascii(data, data.length - 128, 3) === "TAG") {
        const base = data.length - 128;
        result.title = bytesToText(data.subarray(base + 3, base + 33), "iso-8859-1").replace(/\0/g, "");
        result.artist = result.artist || bytesToText(data.subarray(base + 33, base + 63), "iso-8859-1").replace(/\0/g, "");
        result.album = result.album || bytesToText(data.subarray(base + 63, base + 93), "iso-8859-1").replace(/\0/g, "");
      }
      return result;
    }

    function getAudioDuration(blob) {
      return new Promise(resolve => {
        const url = URL.createObjectURL(blob);
        const probe = new Audio();
        let settled = false;
        const finish = value => {
          if (settled) return;
          settled = true;
          URL.revokeObjectURL(url);
          resolve(Number.isFinite(value) ? value : 0);
        };
        probe.preload = "metadata";
        probe.onloadedmetadata = () => finish(probe.duration);
        probe.onerror = () => finish(0);
        probe.src = url;
        setTimeout(() => finish(0), 6500);
      });
    }

    async function imageInfo(blob) {
      if (!blob) return { thumb: "", color: DEFAULT_COLOR };
      let bitmap;
      try {
        if ("createImageBitmap" in window) bitmap = await createImageBitmap(blob);
        else {
          bitmap = await new Promise((resolve, reject) => {
            const img = new Image();
            const url = URL.createObjectURL(blob);
            img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
            img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("image")); };
            img.src = url;
          });
        }
        const size = 180;
        const canvas = document.createElement("canvas");
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext("2d", { willReadFrequently: true });
        const scale = Math.max(size / bitmap.width, size / bitmap.height);
        const w = bitmap.width * scale, h = bitmap.height * scale;
        ctx.drawImage(bitmap, (size - w) / 2, (size - h) / 2, w, h);
        const pixels = ctx.getImageData(0, 0, size, size).data;
        let r = 0, g = 0, b = 0, weight = 0;
        for (let i = 0; i < pixels.length; i += 16) {
          const alpha = pixels[i + 3] / 255;
          const brightness = (pixels[i] + pixels[i + 1] + pixels[i + 2]) / 3;
          if (alpha < .5 || brightness < 22 || brightness > 240) continue;
          const saturation = Math.max(pixels[i], pixels[i + 1], pixels[i + 2]) - Math.min(pixels[i], pixels[i + 1], pixels[i + 2]);
          const wgt = 1 + saturation / 90;
          r += pixels[i] * wgt; g += pixels[i + 1] * wgt; b += pixels[i + 2] * wgt; weight += wgt;
        }
        const clamp = value => Math.max(58, Math.min(220, Math.round(value)));
        const rr = weight ? clamp(r / weight) : 146;
        const gg = weight ? clamp(g / weight) : 114;
        const bb = weight ? clamp(b / weight) : 255;
        const color = `#${[rr,gg,bb].map(value => value.toString(16).padStart(2,"0")).join("")}`;
        const thumb = canvas.toDataURL("image/jpeg", .78);
        if (bitmap.close) bitmap.close();
        return { thumb, color };
      } catch { return { thumb: "", color: DEFAULT_COLOR }; }
    }

    function titleFromFileName(name) {
      return name.replace(/\.[^.]+$/, "").replace(/[_]+/g, " ").trim() || "Без назви";
    }

    async function addFiles(fileList, sourceInput) {
      const files = [...fileList].filter(file => {
        const ext = file.name.split(".").pop()?.toLowerCase();
        return file.type.startsWith("audio/") || AUDIO_EXTENSIONS.has(ext);
      });
      if (!files.length) {
        showToast("Обери аудіофайл: MP3, M4A, AAC, WAV, OGG, OPUS, FLAC або WEBM");
        if (sourceInput) sourceInput.value = "";
        return;
      }
      if (!state.db && !state.dbFailed) {
        setBusy(true, "Запуск локального сховища…");
        for (let i = 0; i < 40 && !state.db && !state.dbFailed; i++) {
          await new Promise(resolve => setTimeout(resolve, 100));
        }
      }
      setBusy(true, `Підготовка 1 з ${files.length}…`);
      let added = 0;
      let unsupported = 0;
      try {
        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          setBusy(true, `Підготовка ${i + 1} з ${files.length}: ${file.name}`);
          let metadata = {};
          try { metadata = await extractMetadata(file); } catch { /* filename fallback */ }
          const [{ thumb, color }, duration] = await Promise.all([
            imageInfo(metadata.coverBlob),
            getAudioDuration(file)
          ]);
          if (!duration) unsupported++;
          const track = {
            id: crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`,
            title: metadata.title || titleFromFileName(file.name),
            artist: metadata.artist || "Невідомий виконавець",
            album: metadata.album || "",
            duration,
            color,
            thumb,
            coverBlob: metadata.coverBlob || null,
            audioBlob: file,
            mimeType: file.type || "audio/*",
            fileName: file.name,
            order: state.tracks.length,
            addedAt: Date.now()
          };
          if (state.db) await putTrack(track);
          state.tracks.push(track);
          added++;
          renderLibrary();
        }
        writeCatalogCache();
        if (state.currentIndex < 0 && state.tracks.length) await selectTrack(0, false, 0);
        const warning = unsupported ? ` ${unsupported} формат(и) браузер може не відтворити.` : "";
        const storageWarning = state.db ? "" : " Трек працює, але цей переглядач не дозволив зберегти його після закриття.";
        showToast(`Додано: ${added}.${warning}${storageWarning}`);
      } catch (error) {
        console.error(error);
        showToast("Не вдалося додати частину файлів. Перевір вільне місце.");
      } finally {
        setBusy(false);
        document.querySelectorAll(".native-file-input").forEach(input => input.value = "");
      }
    }

    function bindSwipeGestures() {
      const card = $("#artCard");
      let startX = 0, startY = 0, dx = 0, active = false;
      card.addEventListener("pointerdown", event => {
        if (state.transitioning) return;
        active = true; dx = 0; startX = event.clientX; startY = event.clientY;
        card.setPointerCapture?.(event.pointerId);
      });
      card.addEventListener("pointermove", event => {
        if (!active) return;
        dx = event.clientX - startX;
        const dy = event.clientY - startY;
        if (Math.abs(dx) > Math.abs(dy)) {
          event.preventDefault();
          card.style.transform = `translateX(${dx * .72}px) rotate(${dx / 18}deg)`;
          card.style.opacity = String(Math.max(.55, 1 - Math.abs(dx) / 430));
        }
      });
      const end = () => {
        if (!active) return;
        active = false;
        card.style.transform = ""; card.style.opacity = "";
        if (Math.abs(dx) > 64) changeTrack(dx < 0 ? 1 : -1);
      };
      card.addEventListener("pointerup", end);
      card.addEventListener("pointercancel", end);

      const view = $("#playerView");
      let verticalStart = 0, verticalX = 0, dragging = false;
      view.addEventListener("pointerdown", event => {
        if (event.target.closest("button,input,.art-card")) return;
        verticalStart = event.clientY; verticalX = event.clientX; dragging = true;
      });
      view.addEventListener("pointermove", event => {
        if (!dragging) return;
        const dy = event.clientY - verticalStart;
        const dx2 = event.clientX - verticalX;
        if (dy > 0 && Math.abs(dy) > Math.abs(dx2)) view.style.transform = `translateY(${Math.min(dy * .72, 180)}px)`;
      });
      const verticalEnd = event => {
        if (!dragging) return;
        dragging = false;
        const dy = event.clientY - verticalStart;
        view.style.transform = "";
        if (dy > 75) closePlayer();
      };
      view.addEventListener("pointerup", verticalEnd);
      view.addEventListener("pointercancel", () => { dragging = false; view.style.transform = ""; });
    }

    function bindEvents() {
      document.querySelectorAll(".native-file-input").forEach(input => {
        input.addEventListener("change", event => addFiles(event.target.files, event.target));
      });
      $("#playButton").addEventListener("click", togglePlay);
      $("#miniPlay").addEventListener("click", event => { event.stopPropagation(); togglePlay(); });
      $("#miniPrev").addEventListener("click", event => { event.stopPropagation(); changeTrack(-1); });
      $("#prevButton").addEventListener("click", () => changeTrack(-1));
      $("#nextButton").addEventListener("click", () => changeTrack(1));
      $("#repeatButton").addEventListener("click", cycleRepeat);
      $("#closePlayer").addEventListener("click", closePlayer);
      $("#libraryButton").addEventListener("click", closePlayer);
      $("#miniPlayer").addEventListener("click", openPlayer);
      $("#miniPlayer").addEventListener("keydown", event => { if (event.key === "Enter" || event.key === " ") openPlayer(); });
      $("#seek").addEventListener("input", event => {
        if (!Number.isFinite(audio.duration)) return;
        audio.currentTime = (Number(event.target.value) / 1000) * audio.duration;
        updateTimeline();
      });
      $("#scrim").addEventListener("click", closeActionSheet);
      $("#moveUp").addEventListener("click", () => moveActionTrack(-1));
      $("#moveDown").addEventListener("click", () => moveActionTrack(1));
      $("#deleteTrack").addEventListener("click", deleteActionTrack);

      audio.addEventListener("play", () => {
        state.playing = true;
        if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "playing";
        updatePlayIcons();
      });
      audio.addEventListener("pause", () => {
        state.playing = false;
        if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "paused";
        updatePlayIcons(); scheduleStateSave();
      });
      audio.addEventListener("timeupdate", () => { updateTimeline(); scheduleStateSave(); });
      audio.addEventListener("durationchange", updateTimeline);
      audio.addEventListener("ended", () => {
        if (state.repeat === "one") { audio.currentTime = 0; audio.play(); }
        else changeTrack(1, true);
      });
      audio.addEventListener("error", () => showToast("Цей аудіоформат не підтримується браузером"));

      document.addEventListener("keydown", event => {
        if (event.code === "Space" && !event.target.matches("input,button")) { event.preventDefault(); togglePlay(); }
        if (event.code === "ArrowRight" && event.altKey) changeTrack(1);
        if (event.code === "ArrowLeft" && event.altKey) changeTrack(-1);
        if (event.code === "Escape") { closeActionSheet(); closePlayer(); }
      });
      window.addEventListener("beforeunload", () => {
        scheduleStateSave();
        state.tracks.forEach(track => {
          if (track._audioUrl) URL.revokeObjectURL(track._audioUrl);
          if (track._coverUrl) URL.revokeObjectURL(track._coverUrl);
        });
      });
      bindSwipeGestures();
    }

    async function initialize() {
      bindEvents();
      configureMediaSession();
      state.tracks = readCatalogCache().sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
      renderLibrary();
      try {
        state.db = await openDatabase();
        const [tracks, repeatSetting, playerSetting] = await Promise.all([
          getAllTracks(), getSetting("repeat"), getSetting("player")
        ]);
        state.tracks = tracks.sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
        state.repeat = ["off", "all", "one"].includes(repeatSetting?.value) ? repeatSetting.value : "off";
        writeCatalogCache();
        const saved = playerSetting?.value;
        const savedIndex = saved?.trackId ? state.tracks.findIndex(track => track.id === saved.trackId) : -1;
        if (savedIndex >= 0) await selectTrack(savedIndex, false, Number(saved.position) || 0);
        else if (state.tracks.length) await selectTrack(0, false, 0);
        else renderLibrary();
        updateRepeatUi();
      } catch (error) {
        console.error(error);
        state.dbFailed = true;
        state.tracks = [];
        renderLibrary();
        showToast("Браузер заборонив постійне сховище. Додавання музики все одно працюватиме до закриття сторінки.");
      }
    }

    initialize();
  </script>
</body>
</html>
